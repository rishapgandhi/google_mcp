[project]
name = "google-mcp"
version = "2.0.0"
description = "Minimal, secure Google Workspace MCP server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "google-api-python-client==2.114.0",
    "google-auth-oauthlib==1.2.0",
    "google-auth==2.27.0",
    "python-dotenv==1.0.1",
]

[project.scripts]
google-mcp = "src.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
